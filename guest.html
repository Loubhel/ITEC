<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Tea Shop - Guest</title>
    <link rel="stylesheet" href="guest.css">
</head>
<body>

    <header>
        <h1>🧋 Milk Tea Shop</h1>
        <a href="login.html" class="logout-btn">Logout</a>
    </header>

    <section class="menu-container">

        <h2>Our Milk Tea Menu</h2>

        <div id="productContainer" class="product-grid"></div>

    </section>


    <!-- Order Popup -->
    <div class="popup" id="orderPopup">

        <div class="popup-content">

            <h2>Add Order</h2>

            <p id="productName"></p>
            <p id="productPrice"></p>

            <label>Quantity</label>
            <input type="number" id="quantity" min="1" value="1">

            <div class="popup-buttons">
                <button id="cancelOrder">Cancel</button>
                <button id="confirmOrder">Okay</button>
            </div>

        </div>

    </div>


    <!-- Confirmation Popup -->
    <div class="popup" id="confirmationPopup">

        <div class="popup-content">

            <h2>Order Confirmation</h2>

            <div id="confirmationDetails"></div>

            <label>Mode of Payment</label>

            <select id="paymentMethod">
                <option value="Cash">Cash</option>
                <option value="GCash">GCash</option>
            </select>

            <div class="popup-buttons">
                <button id="removeOrder">Remove</button>
                <button id="submitOrder">Submit Order</button>
            </div>

        </div>

    </div>

    <script src="js/guest.js"></script>

</body>
</html>
