<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Milk Tea</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="guest-container">
        <div class="login-card">
            <div class="logo-section">
                <h1>🧋 Milk Tea</h1>
                <p>Refreshing Moments, Sweet Memories</p>
            </div>

            <h2>How would you like to enter?</h2>

            <div class="btn-group">
                <button id="guestBtn">Continue as Guest</button>
                <button id="adminBtn">Admin Login</button>
            </div>

            <div class="admin-info">
                <small>Admin access is for staff only</small>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("guestBtn").addEventListener("click", () => {
            window.location.href = "menu.html";
        });

        document.getElementById("adminBtn").addEventListener("click", () => {
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
