<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Milk Tea</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <nav>
        <h2>🧋 Milk Tea Admin</h2>
        <div class="nav-links">
            <a href="admin.html">Products</a>
            <a href="orders.html">Orders</a>
            <a href="history.html">History</a>
            <a href="archive.html">Archive</a>
            <span id="adminUser" style="padding:8px 14px; font-size:0.9rem; opacity:0.9;"></span>
            <a href="guest.html" id="logoutLink">Logout</a>
        </div>
    </nav>

    <div class="container">

        <!-- Add Product Form -->
        <div class="form-card">
            <h2>Add New Product</h2>
            <input type="text" id="productName" placeholder="Product Name">
            <input type="number" id="productPrice" placeholder="Price (₱)" step="0.01">
            <label style="display:block; text-align:left; font-weight:600; margin-bottom:6px; color:#6D4C41;">Category</label>
            <select id="productCategory">
                <option value="milktea">Milk Tea</option>
                <option value="fruittea">Fruit Tea</option>
                <option value="special">Specialty</option>
            </select>
            <label style="display:block; text-align:left; font-weight:600; margin:12px 0 6px; color:#6D4C41;">Status</label>
            <select id="productStatus">
                <option value="Available">Available</option>
                <option value="Not Available">Not Available</option>
            </select>
            <button id="addProductBtn">Add Product</button>
        </div>

        <!-- Products List -->
        <div class="products-section">
            <h2>All Products</h2>
            <div id="productList"></div>
        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
